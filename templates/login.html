{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; background-color: #f9f9f9;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: 0 4px 12px rgba(9, 144, 11, 0.1); border-radius: 12px; overflow: hidden;">
        
       <!-- Card Header -->
<div class="card-header" style="padding: 32px 24px; background-color: #007bff; color: white; text-align: center;">
    <p style="opacity: 0.7; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Welcome Back</p>
    <h1 style="margin: 0 0 8px;">Sign in to AquaBook</h1>
    <p style="opacity: 0.85; margin: 0;">Access your water booking dashboard</p>
</div>

        <!-- Card Body -->
        <div class="card-body" style="padding: 24px;">
            <form method="POST" autocomplete="on">

                <!-- Email Field -->
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                        style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem;"
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem;"
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px; background-color: #007bff; border: none;">
                    🔐 Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="divider" style="text-align: center; margin: 20px 0; color: #aaa;">or</div>

            <!-- Register Link -->
            <p class="text-center" style="font-size: 0.9rem; color: #555;">
                Don't have an account?
                <a href="/register" class="text-link" style="color: #007bff; text-decoration: none;">Create one free →</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
