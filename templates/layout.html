<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Booking System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

/* GENERAL */

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0a2540,#0e4f8a,#0a2540);
min-height:100vh;
color:white;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
padding:20px;
}

/* FLASH MESSAGE */

.flash{
padding:12px;
border-radius:8px;
margin-bottom:10px;
}

.flash.success{
background:#d4edda;
color:#155724;
}

.flash.error{
background:#f8d7da;
color:#721c24;
}

/* HERO SECTION */

.hero-section{
text-align:center;
max-width:900px;
margin:80px auto 40px;
}

.hero-section h1{
font-size:48px;
margin-bottom:20px;
}

.hero-section p{
font-size:18px;
opacity:0.9;
margin-bottom:30px;
}

/* HERO BUTTONS */

.hero-btns a{
display:inline-block;
padding:12px 26px;
border-radius:8px;
text-decoration:none;
font-weight:500;
margin:8px;
}

.btn-primary{
background:#0e4f8a;
color:white;
}

.btn-primary:hover{
background:#08345e;
}

.btn-secondary{
border:2px solid white;
color:white;
}

.btn-secondary:hover{
background:white;
color:#0a2540;
}

/* FEATURES */

.features-grid{
margin-top:60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
max-width:1000px;
margin-left:auto;
margin-right:auto;
}

.feature-card{
background:white;
padding:30px;
border-radius:14px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
color:#333;
}

.feature-card i{
font-size:32px;
color:#0e4f8a;
margin-bottom:10px;
}

.feature-card h3{
margin-bottom:10px;
color:#0e4f8a;
}

/* ADMIN HEADER */

.admin-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.admin-header h2{
font-size:26px;
}

/* BUTTONS */

.btn-action{
background:#0e4f8a;
color:white;
padding:8px 14px;
border-radius:6px;
text-decoration:none;
font-size:14px;
}

.btn-action:hover{
background:#08345e;
}

.logout-btn{
background:#dc3545;
}

.logout-btn:hover{
background:#a71d2a;
}

/* STATS GRID */

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-card{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
color:#333;
}

.stat-card i{
font-size:32px;
color:#0e4f8a;
margin-bottom:10px;
}

.stat-card p{
font-size:26px;
font-weight:600;
color:#0e4f8a;
}

/* CARD */

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
color:#333;
}

/* TABLE */

.admin-table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.admin-table th{
background:#0e4f8a;
color:white;
padding:12px;
}

.admin-table td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
}

.admin-table tr:hover{
background:#f8f9fa;
}

/* STATUS */

.status-badge{
padding:6px 10px;
border-radius:6px;
font-size:12px;
font-weight:500;
}

.pending{
background:#fff3cd;
color:#856404;
}

.delivered{
background:#d4edda;
color:#155724;
}

/* SUPPORT SECTION */

.support-section{
text-align:center;
margin-top:70px;
}

.support-section h2{
font-size:28px;
margin-bottom:10px;
}

.support-buttons{
margin-top:20px;
}

.support-buttons a{
display:inline-block;
padding:12px 20px;
margin:10px;
border-radius:8px;
text-decoration:none;
font-weight:500;
}

.whatsapp-btn{
background:#25D366;
color:white;
}

.whatsapp-btn:hover{
background:#1ebe5d;
}

.email-btn{
background:#0e4f8a;
color:white;
}

.email-btn:hover{
background:#08345e;
}

</style>

</head>

<body>

<div class="container">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="flash {{ category }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

{% block content %}{% endblock %}

</div>

</body>

</html>
